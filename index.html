<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d18">
    <title>Zentra AI</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #090d18;
            --panel: #111827;
            --panel-light: #192338;
            --accent: #7c5cff;
            --accent-light: #a995ff;
            --text: #f4f6ff;
            --muted: #9ba7bd;
            --border: #263148;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
            height: 100dvh;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 900px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--background);
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(17, 24, 39, 0.94);
        }

        .logo {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c5cff, #35c7ff);
            font-weight: 800;
            font-size: 22px;
            color: white;
        }

        .brand h1 {
            font-size: 18px;
            margin: 0;
        }

        .brand p {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--muted);
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #69e6a6;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            text-align: center;
            margin: auto 0;
            padding: 25px 10px;
        }

        .welcome h2 {
            font-size: clamp(26px, 6vw, 38px);
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.6;
        }

        .message {
            max-width: 85%;
            padding: 13px 16px;
            border-radius: 17px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            align-self: flex-end;
            background: var(--accent);
            border-bottom-right-radius: 5px;
        }

        .assistant {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }

        .typing {
            color: var(--muted);
            font-size: 13px;
            padding: 0 18px 10px;
        }

        .composer-wrap {
            padding: 12px 14px max(14px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: var(--background);
        }

        .composer {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--panel);
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            color: var(--text);
            background: transparent;
            padding: 10px;
            min-height: 42px;
            max-height: 140px;
            font: inherit;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        button {
            cursor: pointer;
            border: none;
            font: inherit;
        }

        #send {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 13px;
            color: white;
            background: var(--accent);
            font-size: 20px;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 0;
            color: var(--muted);
            font-size: 11px;
        }

        .clear {
            background: transparent;
            color: var(--muted);
            padding: 4px 6px;
        }

        .clear:hover {
            color: var(--text);
        }

        @media (min-width: 650px) {
            #chat {
                padding: 28px;
            }

            .composer-wrap {
                padding-left: 24px;
                padding-right: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header>
            <div class="logo">Z</div>

            <div class="brand">
                <h1>Zentra AI</h1>
                <p>Your personal AI assistant</p>
            </div>

            <div class="status" id="status">Ready</div>
        </header>

        <section id="chat" aria-live="polite">
            <div class="welcome" id="welcome">
                <h2>Welcome to Zentra</h2>
                <p>
                    A new beginning for your personal AI.<br>
                    Ask a question or teach Zentra something new.
                </p>
            </div>
        </section>

        <div class="typing" id="typing" hidden>
            Zentra is thinking...
        </div>

        <section class="composer-wrap">
            <form class="composer" id="form">
                <textarea
                    id="input"
                    placeholder="Message Zentra..."
                    aria-label="Message Zentra"
                    rows="1"
                    maxlength="5000"
                    required
                ></textarea>

                <button id="send" type="submit" aria-label="Send message">
                    ↑
                </button>
            </form>

            <div class="toolbar">
                <span>Memory-enabled local assistant</span>
                <button class="clear" id="clear" type="button">
                    Clear chat
                </button>
            </div>
        </section>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const sendButton = document.getElementById("send");
        const statusLabel = document.getElementById("status");
        const typing = document.getElementById("typing");
        const welcome = document.getElementById("welcome");

        const STORAGE_KEY = "zentra_chat_v1";
        let busy = false;

        function loadHistory() {
            try {
                const history = JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );

                if (!Array.isArray(history)) return [];

                return history.filter(item =>
                    item &&
                    ["user", "assistant"].includes(item.role) &&
                    typeof item.text === "string"
                );
            } catch {
                return [];
            }
        }

        let history = loadHistory();

        function saveHistory() {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(history.slice(-100))
                );
            } catch (error) {
                console.warn("Could not save chat history:", error);
            }
        }

        function renderMessage(role, text, save = true) {
            if (welcome) welcome.remove();

            const bubble = document.createElement("div");
            bubble.className = `message ${role}`;

            // Use textContent to prevent HTML injection.
            bubble.textContent = text;

            chat.appendChild(bubble);
            chat.scrollTop = chat.scrollHeight;

            if (save) {
                history.push({ role, text });
                history = history.slice(-100);
                saveHistory();
            }

            return bubble;
        }

        function restoreHistory() {
            history.forEach(item => {
                renderMessage(item.role, item.text, false);
            });
        }

        async function askZentra(message) {
            if (
                window.ZentraBridge &&
                typeof window.ZentraBridge.ask === "function"
            ) {
                return await window.ZentraBridge.ask(message);
            }

            return "The Python AI engine is not connected. Open Zentra inside the Android app built by the GitHub Actions workflow to use the Python engine.";
        }

        async function sendMessage(message) {
            if (busy || !message.trim()) return;

            busy = true;
            sendButton.disabled = true;
            statusLabel.textContent = "Thinking";
            typing.hidden = false;

            renderMessage("user", message);

            try {
                const answer = await askZentra(message);

                renderMessage(
                    "assistant",
                    String(answer || "I could not generate a response.")
                );
            } catch (error) {
                console.error(error);

                renderMessage(
                    "assistant",
                    "Something went wrong while processing your message. Please try again."
                );
            } finally {
                busy = false;
                sendButton.disabled = false;
                typing.hidden = true;
                statusLabel.textContent = "Ready";
                input.focus();
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message || busy) return;

            input.value = "";
            input.style.height = "auto";

            await sendMessage(message);
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 140) + "px";
        });

        input.addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        document.getElementById("clear").addEventListener("click", () => {
            history = [];
            saveHistory();
            chat.replaceChildren();

            const welcomeScreen = document.createElement("div");
            welcomeScreen.className = "welcome";
            welcomeScreen.innerHTML =
                "<h2>Welcome to Zentra</h2>" +
                "<p>Your conversation has been cleared.</p>";

            chat.appendChild(welcomeScreen);
        });

        restoreHistory();
    </script>
</body>
</html>
