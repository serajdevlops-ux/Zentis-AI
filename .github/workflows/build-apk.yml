name: Build Zentra AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f ai.py

          python -m py_compile ai.py

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets \
            app/src/main/python \
            app/src/main/java/com/zentra/ai

          cp index.html app/src/main/assets/index.html
          cp ai.py app/src/main/python/ai.py

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Zentra"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.chaquo.python' version '17.0.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }

          android {
              namespace 'com.zentra.ai'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.zentra.ai'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }

                  python {
                      version '3.11'
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Zentra AI"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/zentra/ai/MainActivity.java <<'EOF'
          package com.zentra.ai;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.chaquo.python.PyObject;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;

          public class MainActivity extends Activity {
              private WebView webView;
              private PyObject zentraAI;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (!Python.isStarted()) {
                      Python.start(new AndroidPlatform(this));
                  }

                  Python python = Python.getInstance();
                  PyObject module = python.getModule("ai");
                  zentraAI = module.callAttr("ZentraAI");

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.addJavascriptInterface(
                      new ZentraBridge(),
                      "ZentraBridge"
                  );

                  setContentView(webView);
                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              private class ZentraBridge {
                  @JavascriptInterface
                  public String ask(String message) {
                      try {
                          PyObject result = zentraAI.callAttr(
                              "generate",
                              message
                          );

                          return result.toString();
                      } catch (Exception exception) {
                          return "The Python engine encountered an error.";
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zentra-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
